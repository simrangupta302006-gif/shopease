<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | ShopEase</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🛒 <span>ShopEase</span>
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

    </nav>

    <div class="nav-actions">

        <a href="/cart"
           class="cart-btn">

            🛒 Cart

        </a>

    </div>

</header>


<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <p class="small-title">
            JOIN SHOPEASE
        </p>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Create your account to start shopping.
        </p>


        <div class="error-message"
             th:if="${error}"
             th:text="${error}">
        </div>


        <form
            action="/register"
            method="post"
            id="registerForm">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="auth-button"
                id="registerButton">

                Create Account

            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login"
               id="loginLink">

                Login

            </a>

        </p>

    </div>

</section>


<footer>

    <div class="footer-logo">
        🛒 ShopEase
    </div>

    <p>
        Your trusted online shopping destination.
    </p>

    <p class="copyright">
        © 2026 ShopEase. All rights reserved.
    </p>

</footer>


</body>
</html>
