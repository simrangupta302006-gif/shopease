<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | ShopEase</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🛒 <span>ShopEase</span>
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

    </nav>

</header>


<section class="order-success">

    <div class="success-icon">
        ✓
    </div>

    <p class="small-title">
        ORDER CONFIRMED
    </p>

    <h1>
        Thank You,
        <span th:text="${customerName}">
            Customer
        </span>!
    </h1>

    <p class="success-message">

        Your order has been placed successfully.

    </p>


    <div class="order-number">

        <span>
            Order Status
        </span>

        <strong>
            ✓ Confirmed
        </strong>

    </div>


    <div class="payment-confirmation">

        <span>
            Payment Method
        </span>

        <strong th:text="${paymentMethod}">
            Cash on Delivery
        </strong>

    </div>


    <div class="success-actions">

        <a href="/products"
           class="shop-now"
           id="continueShoppingButton">

            Continue Shopping

        </a>

        <a href="/"
           class="continue-link">

            Back to Home

        </a>

    </div>

</section>


<footer>

    <div class="footer-logo">
        🛒 ShopEase
    </div>

    <p>
        Your trusted online shopping destination.
    </p>

    <p class="copyright">
        © 2026 ShopEase. All rights reserved.
    </p>

</footer>


</body>
</html>
